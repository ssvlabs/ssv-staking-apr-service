
services:
  postgres:
    image: postgres:16-alpine
    container_name: ssv-apr-postgres
    restart: always
    environment:
      POSTGRES_DB: ssv_apr
      POSTGRES_USER: ssv_user
      POSTGRES_PASSWORD: ssv_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ssv_user -d ssv_apr']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssv-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssv-apr-api
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ssv_user
      DATABASE_PASSWORD: ssv_password
      DATABASE_NAME: ssv_apr
      ORACLE_URL: ${ORACLE_URL:-https://oracle.example.com}
      RPC_URL: ${RPC_URL:-https://mainnet.infura.io/v3/replace-me}
      CHAIN_ID: ${CHAIN_ID:-1}
      EXPLORER_CENTER_URL: ${EXPLORER_CENTER_URL:-https://explorer-center.example.com/api/v4/mainnet}
      VIEWS_CONTRACT_ADDRESS: ${VIEWS_CONTRACT_ADDRESS:-0xafE830B6Ee262ba11cce5F32fDCd760FFE6a66e4}
      STAKING_CONTRACT_ADDRESS: ${STAKING_CONTRACT_ADDRESS:-0xDD9BC35aE942eF0cFa76930954a156B3fF30a4E1}
      CSSV_SNAPSHOT_ENABLED: ${CSSV_SNAPSHOT_ENABLED:-true}
      CSSV_TOKEN_ADDRESS: ${CSSV_TOKEN_ADDRESS:-0xe018D31F120A637828F46aFD6c64EC099d960546}
      CSSV_SNAPSHOT_START_BLOCK: ${CSSV_SNAPSHOT_START_BLOCK:-24920727}
      LOG_CHUNK_SIZE_BLOCKS: ${LOG_CHUNK_SIZE_BLOCKS:-2400}
      COINGECKO_API_URL: https://api.coingecko.com/api/v3
      APR_CALCULATION_CRON: ${APR_CALCULATION_CRON:-0 0 * * *}
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ssv-network

networks:
  ssv-network:
    driver: bridge

volumes:
  postgres_data:
