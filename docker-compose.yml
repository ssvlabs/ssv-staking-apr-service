
services:
  postgres:
    image: postgres:16-alpine
    container_name: ssv-apr-postgres
    restart: always
    environment:
      POSTGRES_DB: ssv_apr
      POSTGRES_USER: ssv_user
      POSTGRES_PASSWORD: ssv_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ssv_user -d ssv_apr']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ssv-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssv-apr-api
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ssv_user
      DATABASE_PASSWORD: ssv_password
      DATABASE_NAME: ssv_apr
      ORACLE_URL: ${ORACLE_URL:-}
      RPC_URL: ${RPC_URL:-http://hoodi-execution-lb.stage.ops.ssvlabsinternal.com:32000}
      CHAIN_ID: ${CHAIN_ID:-560048}
      EXPLORER_CENTER_URL: http://localhost:8080/api/v4/hoodi
      VIEWS_CONTRACT_ADDRESS: ${VIEWS_CONTRACT_ADDRESS:-0x5AdDb3f1529C5ec70D77400499eE4bbF328368fe}
      STAKING_CONTRACT_ADDRESS: ${STAKING_CONTRACT_ADDRESS:-0x58410Bef803ECd7E63B23664C586A6DB72DAf59c}
      CSSV_SNAPSHOT_ENABLED: ${CSSV_SNAPSHOT_ENABLED:-true}
      CSSV_TOKEN_ADDRESS: ${CSSV_TOKEN_ADDRESS:-0x6e1a5d27361c666f681af06535c8Ac773E571d4d}
      CSSV_DEPLOYMENT_BLOCK: ${CSSV_DEPLOYMENT_BLOCK:-2219319}
      LOG_CHUNK_SIZE_BLOCKS: ${LOG_CHUNK_SIZE_BLOCKS:-2400}
      COINGECKO_API_URL: https://api.coingecko.com/api/v3
      APR_CALCULATION_CRON: ${APR_CALCULATION_CRON:-0 0 * * *}
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ssv-network

networks:
  ssv-network:
    driver: bridge

volumes:
  postgres_data:
